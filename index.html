<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>copicol</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main id="app">
      <nav id="activitybar" aria-label="Vues">
        <!-- Les icônes SVG sont injectées au démarrage (voir init dans main.ts) -->
        <button id="act-history" class="act-btn" type="button" title="Historique (Ctrl+1)" aria-label="Historique"></button>
        <button id="act-favorites" class="act-btn" type="button" title="Favoris (Ctrl+2)" aria-label="Favoris">
          <span id="act-fav-badge" class="act-badge" hidden></span>
        </button>
        <div class="act-spacer"></div>
        <button id="act-menu" class="act-btn" type="button" title="Menu" aria-label="Menu"></button>
      </nav>
      <div id="content">
        <div id="searchbar">
          <span id="search-icon"></span>
          <input
            id="search"
            type="text"
            placeholder="Rechercher…"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="search-clear" type="button" title="Effacer la recherche" aria-label="Effacer la recherche" hidden></button>
        </div>
        <div id="tabs"></div>
        <ul id="list"></ul>
        <!-- Raccourcis contextuels de la vue active (voir renderHints dans main.ts) -->
        <footer id="hints"></footer>
      </div>
    </main>
  </body>
</html>
